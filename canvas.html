<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Растрова графіка (Canvas) — PC_STORE (Варіант 6)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f0eb;
      color: #2d241e;
    }
    nav {
      background: #6b4c35;
      padding: 10px 20px;
    }
    nav a {
      color: #fff;
      margin-right: 18px;
      text-decoration: none;
    }
    nav a:hover { text-decoration: underline; }
    .content {
      max-width: 960px;
      margin: 20px auto;
      padding: 0 20px;
    }
    h1, h2 { color: #6b4c35; }
    .canvas-box {
      background: #fff;
      padding: 20px;
      border: 1px solid #d6c7b7;
      border-radius: 6px;
      text-align: center;
    }
    canvas {
      border: 1px dashed #6b4c35;
      background: #ffffff;
      cursor: pointer;
      max-width: 100%;
    }
    .controls {
      margin-top: 15px;
    }
    button {
      background: #6b4c35;
      color: #fff;
      border: none;
      padding: 10px 18px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
      margin: 0 5px;
    }
    button:hover { background: #523927; }
    .note { font-size: 14px; color: #6b5a4c; }
  </style>
</head>
<body>

<nav>
  <a href="menu.html" style="font-weight:bold;">☰ Меню</a>

</nav>

<main class="content">
  <h1>Інтернет-магазин «PC_STORE»: Растрова графіка (Canvas)</h1>
  <p class="note">
    Масштаб: 1 одиниця = 60 пікселів. Початок координат (0; 0) у точці (210; 160).<br>
    <strong>Клікніть по полотну або натисніть кнопку нижче</strong>, щоб трансформувати та перемістити фігури.
  </p>

  <div class="canvas-box">
    <canvas id="drawingCanvas" width="660" height="330">
      Ваш браузер не підтримує тег canvas.
    </canvas>

    <div class="controls">
      <button type="button" onclick="toggleTransform()">Трансформувати / Перемістити фігури</button>
      <button type="button" onclick="resetCanvas()">Початковий стан</button>
    </div>
  </div>
</main>

<script>
  const canvas = document.getElementById("drawingCanvas");
  const ctx = canvas.getContext("2d");

  const koef = 60; 
  const xc = 210;  
  const yc = 160;  

  let isTransformed = false;

  function drawAxes() {
    ctx.save();
    ctx.strokeStyle = "black";
    ctx.fillStyle = "black";
    ctx.lineWidth = 1.5;
    ctx.font = "14px 'Times New Roman', serif";


    ctx.beginPath();
    ctx.moveTo(15, yc);
    ctx.lineTo(645, yc);

    ctx.lineTo(635, yc - 5);
    ctx.moveTo(645, yc);
    ctx.lineTo(635, yc + 5);
    ctx.stroke();
    ctx.fillText("X", 630, yc + 20);

    ctx.beginPath();
    ctx.moveTo(xc, 315);
    ctx.lineTo(xc, 12);

    ctx.lineTo(xc - 5, 22);
    ctx.moveTo(xc, 12);
    ctx.lineTo(xc + 5, 22);
    ctx.stroke();
    ctx.fillText("Y", xc + 10, 22);

    ctx.lineWidth = 1;
    for (let i = -3; i <= 5; i++) {
      let x = xc + i * koef;
      if (i !== 0) {
        ctx.beginPath();
        ctx.moveTo(x, yc - 5);
        ctx.lineTo(x, yc + 5);
        ctx.stroke();
        ctx.fillText(i.toString(), x - 5, yc - 10);
      }
    }
    ctx.fillText("0", xc - 14, yc + 16);

    for (let j = -2; j <= 2; j++) {
      let y = yc - j * koef;
      if (j !== 0) {
        ctx.beginPath();
        ctx.moveTo(xc - 5, y);
        ctx.lineTo(xc + 5, y);
        ctx.stroke();
        ctx.fillText(j.toString(), xc - 22, y + 5);
      }
    }
    ctx.restore();
  }

  function drawScene() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawAxes();

    ctx.strokeStyle = "black";
    ctx.lineWidth = 1.2;

    // --- ФІГУРА 1: Коло ---
    ctx.save();
    if (isTransformed) {
      ctx.translate(20, -15); 
      let grad = ctx.createLinearGradient(xc - 2 * koef, yc - 2 * koef, xc, yc);
      grad.addColorStop(0, "#ff4d4d");
      grad.addColorStop(1, "#ffcc00");
      ctx.fillStyle = grad;
    } else {
      ctx.fillStyle = "blue";
    }
    ctx.beginPath();
    ctx.arc(xc - 1 * koef, yc - 1 * koef, 1 * koef, 0, 2 * Math.PI);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // --- ФІГУРА 2: Еліпс ---
    ctx.save();
    ctx.translate(xc + 3 * koef, yc - 1 * koef);
    if (isTransformed) {
      ctx.scale(0.65, 0.65); 
      ctx.fillStyle = "#2e7d32";
    } else {
      ctx.fillStyle = "blue";
    }
    ctx.beginPath();
    ctx.ellipse(0, 0, 2 * koef, 1 * koef, 0, 0, 2 * Math.PI);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // --- ФІГУРА 3: Квадрат  ---
    ctx.save();
    ctx.translate(xc + 5.5 * koef, yc - 1.5 * koef);
    if (isTransformed) {
      ctx.rotate(Math.PI / 4); 
      ctx.fillStyle = "#ff9800";
    } else {
      ctx.fillStyle = "blue";
    }
    ctx.beginPath();
    ctx.rect(-0.5 * koef, -0.5 * koef, 1 * koef, 1 * koef);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // --- ФІГУРА 4: Квадрат  ---
    ctx.save();
    if (isTransformed) {
      ctx.translate(0, -45); 
      ctx.fillStyle = "#9c27b0";
    } else {
      ctx.fillStyle = "blue";
    }
    ctx.beginPath();
    ctx.rect(xc - 3 * koef, yc - 1 * koef, 1 * koef, 1 * koef);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // --- СТАТИЧНІ ФІГУРИ  ---
    ctx.fillStyle = "blue";

    // 5. Квадрат 
    ctx.beginPath();
    ctx.rect(xc + 4 * koef, yc, 1 * koef, 1 * koef);
    ctx.fill();
    ctx.stroke();

    // 6. Коло 
    ctx.beginPath();
    ctx.arc(xc + 2 * koef, yc + 1 * koef, 1 * koef, 0, 2 * Math.PI);
    ctx.fill();
    ctx.stroke();

    // 7. Прямокутник 
    ctx.beginPath();
    ctx.rect(xc - 3 * koef, yc + 1 * koef, 2 * koef, 1 * koef);
    ctx.fill();
    ctx.stroke();

    // 8, 9, 10. Три квадрати внизу
    const bottomSquaresX = [0, 3, 5];
    bottomSquaresX.forEach(xPos => {
      ctx.beginPath();
      ctx.rect(xc + xPos * koef, yc + 1 * koef, 1 * koef, 1 * koef);
      ctx.fill();
      ctx.stroke();
    });
  }

  function toggleTransform() {
    isTransformed = !isTransformed;
    drawScene();
  }

  function resetCanvas() {
    isTransformed = false;
    drawScene();
  }

  canvas.addEventListener("mousedown", function() {
    toggleTransform();
  });

  window.onload = drawScene;
</script>

</body>
</html>
