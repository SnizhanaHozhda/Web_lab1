<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg version="1.1" baseProfile="full"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:ev="http://www.w3.org/2001/xml-events"
     width="440" height="210" viewBox="0 0 440 210">
  <title>Малюнок варіанту 6</title>
  <desc>Статичний малюнок: осі координат, два кола, еліпс, прямокутники та квадрати.</desc>
  <rect width="440" height="210" fill="white"/>
  <defs>
      <!-- стрілка на кінці осей -->
      <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
        <polygon points="0,0 8,4 0,8" fill="black"/>
      </marker>
      <!-- symbol: шаблон одиничного квадрата, який потім багаторазово викликаємо через use -->
      <symbol id="sq" viewBox="0 0 40 40">
        <rect x="0" y="0" width="40" height="40" fill="blue" stroke="black" stroke-width="1"/>
      </symbol>
    </defs>
  <g id="axes" stroke="black" stroke-width="1.5" fill="none">
      <line x1="10" y1="100" x2="430" y2="100" marker-end="url(#arrow)"/>
      <line x1="140" y1="205" x2="140" y2="8" marker-end="url(#arrow)"/>
      <polyline points="260,96 260,104" />
      <g stroke-width="1">
        <line x1="20" y1="96" x2="20" y2="104"/><line x1="60" y1="96" x2="60" y2="104"/>
        <line x1="100" y1="96" x2="100" y2="104"/><line x1="180" y1="96" x2="180" y2="104"/>
        <line x1="220" y1="96" x2="220" y2="104"/><line x1="300" y1="96" x2="300" y2="104"/>
        <line x1="340" y1="96" x2="340" y2="104"/>
        <line x1="136" y1="20" x2="144" y2="20"/><line x1="136" y1="60" x2="144" y2="60"/>
        <line x1="136" y1="140" x2="144" y2="140"/><line x1="136" y1="180" x2="144" y2="180"/>
      </g>
    </g>
  <g id="shapes" fill="blue" stroke="black" stroke-width="1">
    <circle cx="100" cy="60" r="40"/>
    <ellipse cx="260" cy="60" rx="80" ry="40"/>
    <rect x="340" y="20" width="40" height="40"/>
    <rect x="20" y="60" width="40" height="40"/>
    <rect x="300" y="100" width="40" height="40"/>
    <circle cx="220" cy="140" r="40"/>
    <rect x="20" y="140" width="80" height="40"/>
  </g>
  <g id="used">
    <use xlink:href="#sq" x="140" y="140" width="40" height="40"/>
      <use xlink:href="#sq" x="260" y="140" width="40" height="40"/>
      <use xlink:href="#sq" x="340" y="140" width="40" height="40"/>
  </g>
  <g id="labels" font-family="Times New Roman, serif" font-size="13" fill="black">
      <text x="418" y="118">X</text><text x="148" y="14">Y</text>
      <text x="14" y="94">-3</text><text x="54" y="94">-2</text><text x="94" y="94">-1</text>
      <text x="128" y="114">0</text><text x="176" y="94">1</text><text x="216" y="94">2</text>
      <text x="256" y="94">3</text><text x="296" y="94">4</text><text x="336" y="94">5</text>
      <text x="122" y="24">2</text><text x="122" y="64">1</text>
      <text x="118" y="144">-1</text><text x="118" y="184">-2</text>
    </g>
</svg>